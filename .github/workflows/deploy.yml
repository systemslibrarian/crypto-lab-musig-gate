name: Deploy to GitHub Pages

# One workflow, one gate. Dependabot's auto-merge used to live in e2e.yml,
# whose `e2e` job ran the build and the cross-browser Playwright suite but not
# the Vitest unit tests and spec KATs that this file's build job runs before
# deploying. A bump could clear the lighter gate, merge itself, and then fail
# here on main where no pull request is watching. Both gate jobs now live in
# this file, and `deploy` and `dependabot-auto-merge` both need both of them.
# e2e.yml is deleted: every command it ran is in the `e2e` job below.
#
# Three triggers, each load-bearing:
#   push          - ship main.
#   pull_request  - the gate judges PRs, so auto-merge has something to wait on.
#   workflow_dispatch - a merge made with GITHUB_TOKEN raises no push event, so
#                   the auto-merge job dispatches this workflow explicitly.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keyed by ref, NOT a bare `pages`: with cancel-in-progress, a PR run would
  # cancel a live main deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (Vitest, incl. spec KATs)
        run: npm test
      - name: Build (typecheck gates the build)
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Accessibility gate (axe-core, WCAG A/AA, both themes)
        run: npm run test:a11y
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Cross-browser end-to-end coverage: Chromium, mobile viewport, Firefox and
  # WebKit. A gate job like `build`, so an engine-specific regression blocks
  # both the deploy and the auto-merge.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (typecheck gates the build)
        run: npm run build
      - name: Install all Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Functional flows — Chromium, mobile viewport, Firefox, WebKit
        run: npm run test:e2e:all
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: [build, e2e]
    # A pull request is gated, never published. NOT `== 'push'`: that would
    # also skip workflow_dispatch, which the post-merge dispatch depends on.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. `needs: [build, e2e]` is the whole safety argument -- a bump can
  # merge itself only once this lab's entire PR gate went green, so the gate
  # decides rather than the version number. A major that actually breaks the
  # lab fails the gate and the PR stays open for a human.
  dependabot-auto-merge:
    needs: [build, e2e]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # actions: write is required by the deploy dispatch below. Without it
      # `gh workflow run` returns HTTP 403 "Resource not accessible by
      # integration", the merged bump never deploys, and a `|| echo` fallback
      # hides it.
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
