# Cross-browser end-to-end coverage.
#
# This is deliberately a SEPARATE workflow from deploy.yml. The fleet standard
# requires deploy.yml to stay byte-for-byte identical across every lab, and it
# installs only Chromium — so Firefox and WebKit cannot run inside it without
# forking a file that is supposed to be shared. Running them here keeps the deploy
# gate verbatim while still catching engine-specific regressions on every push.
#
# The Chromium projects deliberately run in both places: they gate the deploy in
# deploy.yml, and they run here too so a single red check tells you the whole
# story.
name: Cross-browser E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (typecheck gates the build)
        run: npm run build
      - name: Install all Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Functional flows — Chromium, mobile viewport, Firefox, WebKit
        run: npm run test:e2e:all
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Dependabot only. Depends on every gate job in this workflow, so a bump can
  # only merge itself once this lab's whole PR gate went green. Majors are
  # excluded -- the 2026-08-18 batch had to hold back 109 bumps and they were
  # overwhelmingly majors (@noble v2 dropped export subpaths, TypeScript 7,
  # vitest 4), so those still want a human.
  dependabot-auto-merge:
    needs: e2e
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      # Majors included on purpose. `needs:` above already required the whole
      # gate to pass, and that gate -- unit tests, build, axe WCAG and the e2e
      # claims -- judges a bump far better than its version number does. A major
      # that actually breaks this lab fails the gate and stays open for a human.
      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              exit 0
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          echo "::warning::gate passed but the merge did not land after 3 attempts;"
          echo "::warning::leaving this PR open - Dependabot will rebase and retry."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
