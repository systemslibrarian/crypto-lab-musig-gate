# Cross-browser end-to-end coverage.
#
# This is deliberately a SEPARATE workflow from deploy.yml. The fleet standard
# requires deploy.yml to stay byte-for-byte identical across every lab, and it
# installs only Chromium — so Firefox and WebKit cannot run inside it without
# forking a file that is supposed to be shared. Running them here keeps the deploy
# gate verbatim while still catching engine-specific regressions on every push.
#
# The Chromium projects deliberately run in both places: they gate the deploy in
# deploy.yml, and they run here too so a single red check tells you the whole
# story.
name: Cross-browser E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (typecheck gates the build)
        run: npm run build
      - name: Install all Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Functional flows — Chromium, mobile viewport, Firefox, WebKit
        run: npm run test:e2e:all
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
